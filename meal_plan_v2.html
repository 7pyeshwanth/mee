<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Plan v2 — Recomp Protocol</title>
<meta name="description" content="Interactive modular meal plan for body recomposition. Build your daily meals, track macros, and stay under 2500 kcal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f0;--card:#ffffff;--text:#1a1a1a;--muted:#6b7280;--border:#e2e2dd;
  --green:#16653a;--green-light:#e8f5e9;--green-dark:#0d4025;
  --amber:#b45309;--amber-light:#fef3c7;
  --red:#b91c1c;--red-light:#fee2e2;
  --blue:#1e40af;--blue-light:#dbeafe;
  --radius:10px;--shadow:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --shadow-lg:0 4px 12px rgba(0,0,0,0.08);
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
.container{max-width:960px;margin:0 auto;padding:1rem}

/* Header */
.header{text-align:center;padding:2.5rem 1rem 1.5rem}
.header h1{font-size:1.75rem;font-weight:800;color:var(--green);letter-spacing:-0.02em;margin-bottom:0.25rem}
.header p{font-size:0.85rem;color:var(--muted);max-width:500px;margin:0 auto}
.profile-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:0.4rem;margin-top:0.75rem}
.profile-tags span{font-size:0.7rem;font-weight:600;padding:0.25rem 0.6rem;border-radius:100px;background:var(--green-light);color:var(--green)}

/* Nav */
.nav{display:flex;overflow-x:auto;gap:0.25rem;padding:0.5rem 0;margin-bottom:1.5rem;scrollbar-width:none;border-bottom:1px solid var(--border)}
.nav::-webkit-scrollbar{display:none}
.nav-btn{padding:0.6rem 1rem;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-weight:600;font-size:0.8rem;color:var(--muted);white-space:nowrap;transition:all 0.15s;font-family:inherit}
.nav-btn:hover{color:var(--text)}
.nav-btn.active{color:var(--green);border-bottom-color:var(--green)}

/* Sections */
.section{display:none;animation:fadeUp 0.25s ease}
.section.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* Macro Tracker */
.tracker{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1.5rem;box-shadow:var(--shadow);position:sticky;top:0;z-index:10}
.tracker-title{font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);margin-bottom:0.75rem}
.tracker-bar-wrap{background:#e5e7eb;border-radius:100px;height:10px;overflow:hidden;margin-bottom:0.5rem}
.tracker-bar{height:100%;border-radius:100px;transition:width 0.4s ease,background 0.3s;background:var(--green)}
.tracker-bar.warn{background:var(--amber)}
.tracker-bar.over{background:var(--red)}
.tracker-cal{font-size:1.5rem;font-weight:800;letter-spacing:-0.02em}
.tracker-cal span{font-size:0.85rem;font-weight:500;color:var(--muted)}
.tracker-macros{display:flex;gap:1rem;margin-top:0.75rem;flex-wrap:wrap}
.macro-pill{font-size:0.8rem;font-weight:600;padding:0.3rem 0.75rem;border-radius:100px}
.macro-pill.ok{background:var(--green-light);color:var(--green)}
.macro-pill.warn{background:var(--amber-light);color:var(--amber)}
.macro-pill.bad{background:var(--red-light);color:var(--red)}

/* Meal Cards */
.meal-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:1rem;box-shadow:var(--shadow);overflow:hidden}
.meal-header{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.25rem;cursor:pointer;gap:1rem}
.meal-header:hover{background:#fafaf8}
.meal-slot{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted)}
.meal-name{font-size:1rem;font-weight:700;color:var(--text);margin-top:0.15rem}
.meal-quick-cal{font-size:0.85rem;font-weight:700;color:var(--green);white-space:nowrap}
.meal-body{display:none;border-top:1px solid var(--border);padding:1rem 1.25rem}
.meal-body.open{display:block}

/* Combo Selector */
.combo-select{width:100%;padding:0.6rem 0.75rem;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:0.85rem;font-weight:500;background:var(--card);cursor:pointer;margin-bottom:1rem;color:var(--text)}
.combo-select:focus{outline:2px solid var(--green);outline-offset:1px}

/* Ingredient Table */
.ing-table{width:100%;border-collapse:collapse;font-size:0.8rem;margin-bottom:0.75rem}
.ing-table th{text-align:left;padding:0.5rem 0.6rem;font-weight:700;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);border-bottom:2px solid var(--border);white-space:nowrap}
.ing-table td{padding:0.45rem 0.6rem;border-bottom:1px solid #f3f3f0}
.ing-table tr:last-child td{border-bottom:none}
.ing-table .total-row td{font-weight:700;border-top:2px solid var(--border);background:#fafaf8}
.ing-table .diff-row td{font-size:0.75rem;color:var(--muted);font-style:italic}

/* Notes */
.combo-note{font-size:0.8rem;padding:0.75rem;border-radius:8px;margin-top:0.5rem}
.note-why{background:var(--green-light);color:var(--green-dark)}
.note-batch{background:var(--blue-light);color:var(--blue)}
.note-warn{background:var(--amber-light);color:var(--amber)}
.tag{display:inline-block;font-size:0.65rem;font-weight:700;padding:0.15rem 0.5rem;border-radius:100px;margin-right:0.25rem}
.tag-veg{background:#dcfce7;color:#15803d}
.tag-nv{background:#fef3c7;color:#92400e}
.tag-whey{background:#dbeafe;color:#1e40af}
.tag-nowhey{background:#f3e8ff;color:#6b21a8}

/* Sample Week */
.week-tabs{display:flex;gap:0.25rem;margin-bottom:1rem;overflow-x:auto;scrollbar-width:none}
.week-tabs::-webkit-scrollbar{display:none}
.week-btn{padding:0.5rem 1rem;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;font-weight:600;font-size:0.8rem;white-space:nowrap;font-family:inherit;color:var(--muted);transition:0.15s}
.week-btn.active{background:var(--green);color:white;border-color:var(--green)}
.week-day{display:none;animation:fadeUp 0.2s}
.week-day.active{display:block}

/* Ingredients search */
.search-input{width:100%;padding:0.7rem 1rem;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:0.9rem;margin-bottom:1rem;background:var(--card)}
.search-input:focus{outline:2px solid var(--green);outline-offset:1px}
.filter-btns{display:flex;gap:0.25rem;flex-wrap:wrap;margin-bottom:1rem}
.filter-btn{padding:0.35rem 0.75rem;border:1px solid var(--border);border-radius:100px;background:var(--card);cursor:pointer;font-size:0.75rem;font-weight:600;font-family:inherit;color:var(--muted);transition:0.15s}
.filter-btn.active{background:var(--green);color:white;border-color:var(--green)}

/* Accordion */
.accord{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:0.75rem;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
.accord-head{padding:1rem 1.25rem;cursor:pointer;font-weight:700;font-size:1rem;display:flex;justify-content:space-between;align-items:center;user-select:none}
.accord-head:hover{background:#fafaf8}
.accord-head::after{content:'+';font-size:1.25rem;color:var(--green);font-weight:400;transition:transform 0.2s}
.accord-head.open::after{content:'−'}
.accord-body{display:none;padding:0 1.25rem 1.25rem;border-top:1px solid var(--border)}
.accord-body.open{display:block}

/* Generic table */
.g-table{width:100%;border-collapse:collapse;font-size:0.85rem;margin:0.75rem 0}
.g-table th,.g-table td{padding:0.6rem 0.75rem;text-align:left;border-bottom:1px solid var(--border)}
.g-table th{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);background:#fafaf8}
.g-table tr:last-child td{border-bottom:none}

/* Timeline */
.timeline{position:relative;padding-left:2rem;margin:1rem 0}
.timeline::before{content:'';position:absolute;left:0.6rem;top:0;bottom:0;width:2px;background:var(--border)}
.tl-item{position:relative;margin-bottom:1.25rem}
.tl-item::before{content:'';position:absolute;left:-1.65rem;top:0.4rem;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid var(--card)}
.tl-time{font-size:0.75rem;font-weight:700;color:var(--green)}
.tl-content{font-size:0.85rem;margin-top:0.15rem}
.tl-content strong{color:var(--text)}
.tl-warn{font-size:0.75rem;color:var(--red);font-weight:600;margin-top:0.15rem}

/* Lists */
.check-list{list-style:none;padding:0}
.check-list li{padding:0.5rem 0;border-bottom:1px solid #f3f3f0;font-size:0.85rem;padding-left:1.5rem;position:relative}
.check-list li::before{content:'✓';position:absolute;left:0;color:var(--green);font-weight:700}

/* Responsive */
@media(max-width:640px){
  .container{padding:0.75rem}
  .header h1{font-size:1.4rem}
  .tracker-macros{gap:0.5rem}
  .meal-header{flex-direction:column;align-items:flex-start;gap:0.25rem}
  .ing-table{font-size:0.7rem}
  .ing-table th,.ing-table td{padding:0.35rem 0.4rem}
  .g-table{font-size:0.75rem}
  .g-table th,.g-table td{padding:0.4rem 0.5rem}
}
</style>
</head>

// ===================== HELPERS =====================
function comboTotals(combo){
  let t={cal:0,c:0,p:0,f:0,fib:0};
  combo.items.forEach(i=>{t.cal+=i.cal;t.c+=i.c;t.p+=i.p;t.f+=i.f;t.fib+=i.fib});
  return t;
}
function findCombo(id){
  for(let s of SLOTS) for(let c of s.combos) if(c.id===id) return c;
  return null;
}
function r(n){return Math.round(n*10)/10}
function statusClass(val,min,max){
  if(val>=min && val<=max) return 'ok';
  if(val<min*0.9 || val>max*1.1) return 'bad';
  return 'warn';
}

// ===================== STATE =====================
let selected = {};
SLOTS.forEach(s=>{
  let qp = s.combos.find(c=>c.qp);
  selected[s.id] = qp ? qp.id : s.combos[0].id;
});

// ===================== RENDER =====================
function updateTracker(){
  let total={cal:0,c:0,p:0,f:0,fib:0};
  Object.values(selected).forEach(id=>{
    let combo=findCombo(id);
    if(combo){let t=comboTotals(combo);total.cal+=t.cal;total.c+=t.c;total.p+=t.p;total.f+=t.f;total.fib+=t.fib}
  });
  let pct=Math.min((total.cal/2500)*100,100);
  let bar=document.getElementById('cal-bar');
  bar.style.width=pct+'%';
  bar.className='tracker-bar'+(total.cal>2500?' over':total.cal>2400?' warn':'');
  document.getElementById('cal-now').textContent=Math.round(total.cal).toLocaleString();
  let pp=document.getElementById('pill-p');pp.textContent='P: '+r(total.p)+'g';pp.className='macro-pill '+statusClass(total.p,143,160);
  let pf=document.getElementById('pill-f');pf.textContent='F: '+r(total.f)+'g';pf.className='macro-pill '+statusClass(total.f,57,70);
  let pc=document.getElementById('pill-c');pc.textContent='C: '+r(total.c)+'g';pc.className='macro-pill '+statusClass(total.c,315,345);
  let pfib=document.getElementById('pill-fib');pfib.textContent='Fib: '+r(total.fib)+'g';pfib.className='macro-pill '+statusClass(total.fib,26,38);
}

function renderMealCards(){
  let container=document.getElementById('meal-cards');
  container.innerHTML='';
  SLOTS.forEach(slot=>{
    let selCombo=findCombo(selected[slot.id]);

    let qpTotals=comboTotals(slot.combos.find(c=>c.qp)||slot.combos[0]);
    let card=document.createElement('div');card.className='meal-card';
    card.innerHTML=`
      <div class="meal-header" onclick="this.nextElementSibling.classList.toggle('open')">
        <div>
          <div class="meal-slot">${slot.icon} ${slot.name} · ${slot.time}</div>
          <div class="meal-name">${selCombo.name}</div>
        </div>
        <div class="meal-quick-cal">${Math.round(t.cal)} cal</div>
      </div>
      <div class="meal-body">
        <select class="combo-select" onchange="selectCombo('${slot.id}',this.value)">
          ${slot.combos.map(c=>{
            let ct=comboTotals(c);
            let label=c.name+' — '+Math.round(ct.cal)+' cal';
            if(c.qp) label='⭐ '+label;
            c.tags.forEach(tg=>{if(tg==='veg')label+=' 🥬';if(tg==='nv')label+=' 🍗';if(tg==='whey')label+=' [Whey]';if(tg==='no-whey')label+=' [No Whey]'});
            return `<option value="${c.id}" ${c.id===selected[slot.id]?'selected':''}>${label}</option>`;
          }).join('')}
        </select>
        <div style="display:flex;gap:0.25rem;flex-wrap:wrap;margin-bottom:0.75rem">
          ${selCombo.tags.map(tg=>{
            if(tg==='veg')return'<span class="tag tag-veg">🥬 Veg</span>';
            if(tg==='nv')return'<span class="tag tag-nv">🍗 Non-Veg</span>';
            if(tg==='whey')return'<span class="tag tag-whey">Whey</span>';

            return'';
          }).join('')}

        </div>
        <table class="ing-table">
          <thead><tr><th>Ingredient</th><th>Qty</th><th>Cal</th><th>C</th><th>P</th><th>F</th><th>Fib</th></tr></thead>
          <tbody>
            ${selCombo.items.map(i=>`<tr><td>${i.n}</td><td>${i.q}</td><td>${r(i.cal)}</td><td>${r(i.c)}</td><td>${r(i.p)}</td><td>${r(i.f)}</td><td>${r(i.fib)}</td></tr>`).join('')}
            <tr class="total-row"><td><strong>Total</strong></td><td></td><td><strong>${r(t.cal)}</strong></td><td><strong>${r(t.c)}</strong></td><td><strong>${r(t.p)}</strong></td><td><strong>${r(t.f)}</strong></td><td><strong>${r(t.fib)}</strong></td></tr>
            ${!selCombo.qp?`<tr class="diff-row"><td colspan="2">vs Quick Pick</td><td>${(t.cal-qpTotals.cal>=0?'+':'')+r(t.cal-qpTotals.cal)}</td><td>${(t.c-qpTotals.c>=0?'+':'')+r(t.c-qpTotals.c)}</td><td>${(t.p-qpTotals.p>=0?'+':'')+r(t.p-qpTotals.p)}</td><td>${(t.f-qpTotals.f>=0?'+':'')+r(t.f-qpTotals.f)}</td><td>${(t.fib-qpTotals.fib>=0?'+':'')+r(t.fib-qpTotals.fib)}</td></tr>`:''}

        </table>
        <div class="combo-note note-why">💡 ${selCombo.why}</div>
        <div class="combo-note note-batch" style="margin-top:0.4rem">📦 ${selCombo.batch}</div>
        ${selCombo.warn?`<div class="combo-note note-warn" style="margin-top:0.4rem">⚠️ ${selCombo.warn}</div>`:''}
      </div>
    `;
    container.appendChild(card);
  });
}

function selectCombo(slotId,comboId){
  selected[slotId]=comboId;
  renderMealCards();
  updateTracker();
}

  filtersEl.innerHTML='<button class="filter-btn active" onclick="filterIng(\'All\',this)">All</button>';

  renderIngTable();
}
function filterIng(cat,btn){
  activeFilter=cat;
  document.querySelectorAll('#ing-filters .filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderIngTable();
}
function renderIngTable(){
  let search=document.getElementById('ing-search').value.toLowerCase();
  let filtered=INGREDIENTS.filter(i=>{
    if(activeFilter!=='All'&&i.cat!==activeFilter)return false;
    if(search&&!i.n.toLowerCase().includes(search))return false;
    return true;
  });
  let thead=document.querySelector('#ing-table thead');
  thead.innerHTML='<tr><th>Ingredient</th><th>Std Qty</th><th>Cal</th><th>C(g)</th><th>P(g)</th><th>F(g)</th><th>Fib(g)</th><th>Category</th><th>Batch Prep?</th></tr>';
  let tbody=document.querySelector('#ing-table tbody');
  tbody.innerHTML=filtered.map(i=>`<tr><td>${i.n}</td><td>${i.q}</td><td>${i.cal}</td><td>${r(i.c)}</td><td>${r(i.p)}</td><td>${r(i.f)}</td><td>${r(i.fib)}</td><td><span class="tag ${i.cat.includes('NV')?'tag-nv':'tag-veg'}" style="font-size:0.6rem">${i.cat}</span></td><td>${i.bp}</td></tr>`).join('');
}

// ===================== NAV =====================
function toggleAccord(el){
  el.classList.toggle('open');
  el.nextElementSibling.classList.toggle('open');
}

document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.getElementById('sec-'+btn.dataset.tab).classList.add('active');
  });
});
